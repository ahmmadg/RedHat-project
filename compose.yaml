# ============================================================
# TrackFlow — Podman Compose (Phase 2 Approach 2)
# ============================================================

services:
  # ---- 1. PostgreSQL Database Service ----
  database:
    container_name: trackflow-db
    build:
      context: ./database
      dockerfile: Containerfile
    environment:
      POSTGRES_USER: trackflow
      POSTGRES_DB: trackflow
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - db_password
    networks:
      - trackflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackflow -d trackflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- 2. Node.js / Express Backend Service ----
  backend:
    container_name: trackflow-backend
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://trackflow:trackflow_pass@trackflow-db:5432/trackflow?schema=public
    ports:
      - "127.0.0.1:4000:4000"
    secrets:
      - jwt_secret
      - db_password
    depends_on:
      database:
        condition: service_healthy
    networks:
      - trackflow-net

  # ---- 3. React / Nginx Frontend Service ----
  frontend:
    container_name: trackflow-frontend
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    networks:
      - trackflow-net

# ---- Podman Secrets (created externally) ----
secrets:
  jwt_secret:
    external: true
  db_password:
    external: true

# ---- Shared Isolated Bridge Network ----
networks:
  trackflow-net:
    driver: bridge

# ---- Persistent Named Storage Volume ----
volumes:
  pgdata:
