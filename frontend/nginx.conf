server {
    listen 80;
    server_name localhost;

    # Root directory for static production bundle
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing fallback: all non-asset routes fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: forward /api/* requests to backend service container on port 4000
    # Using variable + resolver prevents Nginx from crashing at startup if backend is temporarily offline
    location /api/ {
        resolver 127.0.0.11 10.89.0.1 169.254.1.1 valid=10s ipv6=off;
        set $backend "http://trackflow-backend:4000";
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
